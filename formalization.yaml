fidelity:
  divergences: >
    The OS axioms are formalized in the Glimm-Jaffe probability-measure formulation
    (predicates on ProbabilityMeasure FieldConfiguration) rather than the original
    Schwinger-function formulation of Osterwalder-Schrader. OS3 is stated in the complex
    star formulation (OS 1975 axiom E2) with an equivalent real reformulation
    (OS3_ReflectionPositivity_real). OS4 is split into a clustering statement and an
    ergodicity statement, with ergodicity derived from a polynomial-clustering bound
    (alpha = 6). The dimension-generic master theorem is proved for every d >= 2: the OS3
    mixed-representation proper-time Fubini domination runs at boundary-vanishing order d,
    so no upper bound on the dimension is needed. The registry Challenge (in the wrapper
    repository) restates the
    headline existentially, in Mathlib-only terms: there exists a probability measure on
    S'(R^d) whose generating functional is exp(-1/2 <f, Cf>) with C the proper-time
    (heat-kernel) integral of the free covariance — the characterization clause pins the
    measure uniquely (bare existence would be satisfied by the Dirac measure at 0) — and
    which satisfies the five restated OS predicates; the dimension hypothesis 2 <= d is
    carried as a Fact instance binder.
  axiom_footprint: >
    All six library headline theorems (the dimension-generic master theorem, the
    all-dimensions corollary, and the d = 2, 3, 4, 5 instances) and the registry Solution
    theorem depend on exactly Lean's three foundational axioms (propext, Classical.choice,
    Quot.sound); for the library this is build-frozen via #guard_msgs in
    OSforGFF/Guardrails.lean; for the wrapper's Solution it is enforced by that
    repository's comparator.json permitted_axioms.

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    0 sorries and 0 custom axioms in the OSforGFF source (54 on-graph files, ~31,500 lines,
    plus 6 off-graph Legacy files preserving superseded 4D-era proofs). The registry
    Challenge/Solution pair, and the single `sorry` that is its challenge hole, live in
    mrdouglasny/OSforGFF-comparator. External dependencies
    (bochner, gaussian-field, kolmogorov_extension4) are themselves axiom-free per their
    own documentation. The 4D core of the library was reviewed and merged upstream
    (mrdouglasny/OSforGFF PR #7).

