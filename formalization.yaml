# formalization.yaml — https://github.com/mathlib-initiative/formalization.yaml (v0.4)
# Describes the dimension-generic library (uniform μ_GFF d, every d ≥ 2). 0 sorries,
# 0 custom axioms; ~31,500 lines across 54 on-graph files (+6 off-graph Legacy files).
# The Palomar registry Challenge/Solution pair lives in the thin wrapper repository
# mrdouglasny/OSforGFF-comparator, which pins this one by commit.
version: "v0.4"

project:
  name: "OSforGFF"
  description: >-
    Construction of the massive Gaussian Free Field in Euclidean spacetime of any
    dimension d >= 2 as a probability measure on the tempered distributions S'(R^d),
    and a proof that it satisfies all of the Osterwalder-Schrader axioms: OS0
    analyticity, OS1 regularity, OS2 Euclidean invariance, OS3 reflection positivity,
    and OS4 clustering and ergodicity. The OS axioms are the conditions under which a
    Euclidean field theory reconstructs a relativistic quantum field theory obeying the
    Wightman axioms, so the free field is the base case of constructive quantum field
    theory on which interacting constructions are built. The development is
    dimension-generic: one proof parameterized by d, consuming the free covariance only
    through a typeclass whose per-dimension input is a single closed-form radial kernel
    identified with the proper-time integral, with concrete instances at d = 2, 3, 4, 5.
    The result addresses three research audiences. In constructive quantum field theory,
    the free field satisfying OS0-OS4 is the base case (Glimm-Jaffe, ch. 6) on which
    interacting constructions such as P(phi)_2 and phi^4_3 are built, so a machine-checked
    base case is the reusable starting point for any formalized interacting construction.
    In stochastic quantization and singular SPDEs, the massive GFF constructed here is the
    reference Gaussian and the invariant measure of the free dynamics in every dimension
    treated. And for researchers formalizing quantum field theory in various dimensions,
    this is, to our knowledge, the first machine-checked verification of the
    Osterwalder-Schrader axioms, with the dimension-generic propagator typeclass as the
    designed extension point for further covariances and dimensions.
  authors:
    - "Sergey A. Cherkis"
    - "Michael R. Douglas"
    - "Sarah Hoback"
    - "Anna Mei"
    - "Ron Nissim"
  responsible_maintainers: ["Michael R. Douglas"]
  license: "Apache-2.0"

