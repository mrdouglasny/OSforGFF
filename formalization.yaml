status:
  scope: >
    Constructs the massive Gaussian Free Field (GFF) in Euclidean spacetime as a
    probability measure on the tempered distributions S'(R^d) (FieldConfiguration d),
    built via the Minlos theorem from the free covariance (-Delta + m^2)^{-1}, and
    proves it satisfies all five Osterwalder-Schrader axioms (OS0 analyticity, OS1
    regularity, OS2 Euclidean invariance, OS3 reflection positivity, OS4 clustering +
    ergodicity). The library is DIMENSION-GENERIC: one proof, parameterized by d : N,
    consumes the free covariance only through a GFFPropagator d m typeclass (whose per-d
    input is a single closed-form radial kernel identified with the generic proper-time
    integral). The dimension-generic master theorem holds for every d >= 2; concrete
    instances are provided for d = 2 (Bessel K_0), d = 3 (Yukawa), d = 4 (Bessel K_1), and
    d = 5 (K_{3/2}), all routed through one master Bessel identity (General/BesselK.lean),
    plus an all-dimensions corollary via a canonical proper-time propagator. The OS3
    mixed-representation proper-time Fubini domination runs at boundary-vanishing order d,
    so no upper bound on the dimension is needed. Nuclear-space structure and the
    Minlos/Kolmogorov machinery are supplied by the external libraries bochner
    (BochnerMinlos), gaussian-field (GaussianField), and kolmogorov_extension4, all of
    which are axiom-free. A self-contained Mathlib-only restatement of the headline result,
    and its proof from this library, are carried by the thin Comparator wrapper
    mrdouglasny/OSforGFF-comparator.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "OSforGFF.gaussianFreeField_satisfies_all_OS_axioms_generic"
      file: "OSforGFF/OS/Master.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "the free GFF in dimension d (d>=2, m>0) satisfies all Osterwalder-Schrader axioms OS0-OS4"
          source: "10.1007/BF01645738"
        - statement: "reflection positivity (OS3) and OS reconstruction framework"
          source: "10.1007/BF01608978"
        - statement: "construction and proof conventions for the free Euclidean field"
          source: "ISBN:978-0-387-96477-7"
    - declaration: "OSforGFF.gaussianFreeField_satisfies_all_OS_axioms_of_dim"
